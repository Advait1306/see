[workspace]
members = [".", "xtask"]

[package]
name = "august"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "august"
path = "src/main.rs"

[lib]
name = "august"
path = "src/lib.rs"

[package.metadata.bundle]
name = "August"
identifier = "com.august.app"
category = "public.app-category.developer-tools"
short_description = "A terminal application with workspaces"
osx_minimum_system_version = "10.15"
icon = ["assets/icon.icns"]

[dependencies]
alacritty_terminal = "0.25.1"
anyhow = "1.0.100"
core-text = "=21.0.0"
dirs = "6.0.0"
env_logger = "0.11.8"
futures = "0.3.31"
git2 = { version = "0.20.3", features = ["vendored-openssl"] }
gpui = "0.2.2"
gpui-component = "0.5.0"
gpui-component-assets = "0.5.0"
log = "0.4.29"
notify = "7.0"
nucleo-matcher = "0.3.1"
parking_lot = "0.12.5"
rfd = "0.17.2"
ropey = "1.6.1"
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
similar = "2.7.0"
smol = "2.0.2"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
uuid = { version = "1.19.0", features = ["v4"] }
walkdir = "2.5.0"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
tempfile = "3"
